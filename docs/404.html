<!DOCTYPE html>
<html>
<head>

    <title>Redirecting...</title>
    <link id="canonical-link" rel="canonical" href="https://docs.restech.unsw.edu.au/">

    <script type="text/javascript">
        if (window.location.pathname.startsWith('/restech-docs-2')) {
            window.location.replace('https://docs.restech.unsw.edu.au/');
        } else {
            document.body.innerHTML = '<h1>404 - Page Not Found</h1>';
        }
    </script>
</head>
<body>
